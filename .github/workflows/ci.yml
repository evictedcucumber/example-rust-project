name: Build & Test

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains/
            target/
          key: build-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}

      - name: Build
        run: cargo build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.cargo/bin/
            target/
          key: test-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}

      - name: Install Nextest
        run: cargo install cargo-nextest --locked

      - name: Test
        run: cargo nextest run

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.cargo/bin/
          key: coverage-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}

      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Test
        run: cargo tarpaulin run --fail-under 80
